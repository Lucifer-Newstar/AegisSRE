# =============================================================================
# AegisSRE — Local development stack (P2: observability + AegisShop v1)
#
# Runs the platform's data + observability dependencies. Application services
# (backend, frontend, ml, ai) are added as they are implemented — see
# docs/architecture/system-architecture.md and docs/project/roadmap.md.
#
# Design posture: "Compose now, Kubernetes-ready later." Every service here has
# a corresponding Kustomize base in infra/k8s/base/ that is deployed the same
# way on a cluster. Configs live under infra/ and are shared by both runtimes.
#
#   make infra-up       → docker compose up -d --wait
#   make infra-down     → docker compose down -v
# =============================================================================

name: aegissre

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Data layer ────────────────────────────────────────────────────────────
  postgres:
    image: ${AEGIS_POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337}
    container_name: aegissre-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegissre}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [aegissre]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: aegissre-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [aegissre]
    logging: *default-logging

  # ── Observability layer ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aegissre-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aegissre]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    container_name: aegissre-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aegis}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      prometheus: { condition: service_healthy }
    networks: [aegissre]
    logging: *default-logging

  loki:
    image: grafana/loki:3.3.2
    container_name: aegissre-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aegissre]
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.6.1
    container_name: aegissre-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP API (OTLP receivers are internal to the Compose network)
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aegissre]
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: aegissre-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    # No healthcheck: the otel/opentelemetry-collector-contrib image is
    # distroless (no wget/curl/shell), so a container-side healthcheck is
    # impossible. Nothing depends on collector *health* — catalog waits on
    # service_started only.
    depends_on:
      tempo: { condition: service_started }
      loki: { condition: service_healthy }
    networks: [aegissre]
    logging: *default-logging

  # ── Demo workload (AegisShop) ─────────────────────────────────────────────
  # First vertical slice: catalog-service. Proves the observability flow
  # (metrics + traces → OTLP collector → Prometheus/Tempo → Grafana) end to
  # end. More AegisShop services join in P2.
  catalog-service:
    build:
      context: .
      dockerfile: demoapp/aegisshop/catalog-service/Dockerfile
    image: aegisshop/catalog-service:0.1.0
    container_name: aegisshop-catalog
    environment:
      SERVICE_NAME: catalog-service
      SERVICE_PORT: "9001"
      ENVIRONMENT: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:9001:9001"
    depends_on:
      otel-collector: { condition: service_started }
    networks: [aegissre]
    logging: *default-logging

  cart-service:
    build:
      context: .
      dockerfile: demoapp/aegisshop/cart-service/Dockerfile
    image: aegisshop/cart-service:0.1.0
    container_name: aegisshop-cart
    environment:
      SERVICE_NAME: cart-service
      SERVICE_PORT: "9002"
      ENVIRONMENT: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:9002:9002"
    depends_on:
      otel-collector: { condition: service_started }
    networks: [aegissre]
    logging: *default-logging

  order-service:
    build:
      context: .
      dockerfile: demoapp/aegisshop/order-service/Dockerfile
    image: aegisshop/order-service:0.1.0
    container_name: aegisshop-order
    environment:
      SERVICE_NAME: order-service
      SERVICE_PORT: "9003"
      ENVIRONMENT: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      CART_SERVICE_URL: http://cart-service:9002
    ports:
      - "127.0.0.1:9003:9003"
    depends_on:
      cart-service: { condition: service_started }
      otel-collector: { condition: service_started }
    networks: [aegissre]
    logging: *default-logging

  payment-service:
    build:
      context: .
      dockerfile: demoapp/aegisshop/payment-service/Dockerfile
    image: aegisshop/payment-service:0.1.0
    container_name: aegisshop-payment
    environment:
      SERVICE_NAME: payment-service
      SERVICE_PORT: "9004"
      ENVIRONMENT: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:9004:9004"
    depends_on:
      otel-collector: { condition: service_started }
    networks: [aegissre]
    logging: *default-logging

  registry-service:
    build:
      context: .
      dockerfile: backend/services/registry-service/Dockerfile
    image: aegissre/registry-service:0.1.0
    container_name: aegissre-registry
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+psycopg://aegis:aegis@postgres:5432/aegissre}
      SERVICE_NAME: registry-service
      SERVICE_PORT: "8101"
      ENVIRONMENT: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      REGISTRY_PROBE: "true"
    ports:
      - "127.0.0.1:8101:8101"
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [aegissre]
    logging: *default-logging

  deployments-service:
    build:
      context: .
      dockerfile: backend/services/deployments-service/Dockerfile
    image: aegissre/deployments-service:0.1.0
    container_name: aegissre-deployments
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+psycopg://aegis:aegis@postgres:5432/aegissre}
      SERVICE_NAME: deployments-service
      SERVICE_PORT: "8701"
      ENVIRONMENT: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:8701:8701"
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [aegissre]
    logging: *default-logging

  incidents-service:
    build:
      context: .
      dockerfile: backend/services/incidents-service/Dockerfile
    image: aegissre/incidents-service:0.1.0
    container_name: aegissre-incidents
    environment:
      AEGIS_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+psycopg://aegis:aegis@postgres:5432/aegissre}
      AEGIS_API_TOKEN: ${AEGIS_API_TOKEN:-}
      AEGIS_DEV_MODE: ${AEGIS_DEV_MODE:-false}
      AEGIS_EXECUTOR: simulation
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_WORKER_ENABLED: "true"
      AEGIS_COLLECTOR_ENABLED: "true"
      AEGIS_KNOWLEDGE_ENABLED: ${AEGIS_KNOWLEDGE_ENABLED:-true}
      AEGIS_LLM_PROVIDER: ${AEGIS_LLM_PROVIDER:-disabled}
      AEGIS_LLM_URL: ${AEGIS_LLM_URL:-http://localhost:11434}
      AEGIS_LLM_MODEL: ${AEGIS_LLM_MODEL:-}
      AEGIS_LLM_API_KEY: ${AEGIS_LLM_API_KEY:-}
      AEGIS_LLM_ALLOW_REMOTE: ${AEGIS_LLM_ALLOW_REMOTE:-false}
      AEGIS_LLM_TIMEOUT_SECONDS: ${AEGIS_LLM_TIMEOUT_SECONDS:-30}
      AEGIS_LLM_MAX_OUTPUT_TOKENS: ${AEGIS_LLM_MAX_OUTPUT_TOKENS:-1024}
      AEGIS_LLM_REQUESTS_PER_HOUR: ${AEGIS_LLM_REQUESTS_PER_HOUR:-10}
      AEGIS_LLM_REQUESTS_PER_DAY: ${AEGIS_LLM_REQUESTS_PER_DAY:-50}
      AEGIS_POLL_SECONDS: ${AEGIS_POLL_SECONDS:-15}
      AEGIS_ENVIRONMENT: dev
      AEGIS_PROMETHEUS_URL: http://prometheus:9090
      AEGIS_REGISTRY_URL: http://registry-service:8101
      AEGIS_DEPLOYMENTS_URL: http://deployments-service:8701
      AEGIS_LOKI_URL: http://loki:3100
      AEGIS_TEMPO_URL: http://tempo:3200
    ports:
      - "127.0.0.1:8201:8201"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      prometheus: { condition: service_healthy }
      registry-service: { condition: service_healthy }
      deployments-service: { condition: service_healthy }
    networks: [aegissre]
    logging: *default-logging

  api-gateway:
    build:
      context: .
      dockerfile: backend/services/api-gateway/Dockerfile
    image: aegissre/api-gateway:0.1.0
    container_name: aegissre-gateway
    environment:
      AEGIS_GATEWAY_API_TOKEN: ${AEGIS_API_TOKEN:-}
      AEGIS_GATEWAY_INCIDENTS_TOKEN: ${AEGIS_API_TOKEN:-}
      AEGIS_GATEWAY_REDIS_URL: redis://redis:6379/0
      AEGIS_GATEWAY_REGISTRY_URL: http://registry-service:8101
      AEGIS_GATEWAY_DEPLOYMENTS_URL: http://deployments-service:8701
      AEGIS_GATEWAY_INCIDENTS_URL: http://incidents-service:8201
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      redis: { condition: service_healthy }
      incidents-service: { condition: service_healthy }
      registry-service: { condition: service_healthy }
      deployments-service: { condition: service_healthy }
    networks: [aegissre]
    logging: *default-logging

  console:
    build: ./frontend
    image: aegissre/console:0.1.0
    container_name: aegissre-console
    environment:
      PORT: "3030"
      REGISTRY_URL: http://registry-service:8101
      DEPLOYMENTS_URL: http://deployments-service:8701
    ports:
      - "127.0.0.1:3030:3030"
    depends_on:
      registry-service: { condition: service_started }
      deployments-service: { condition: service_started }
    networks: [aegissre]
    logging: *default-logging

networks:
  aegissre:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
