apiVersion: v1
kind: Config
clusters:
- name: in-cluster
  cluster:
    server: https://kubernetes.default.svc
    certificate-authority: /var/run/aegis-executor/ca.crt
users:
- name: scoped-executor
  user:
    tokenFile: /var/run/aegis-executor/token
contexts:
- name: aegis-scoped-executor
  context:
    cluster: in-cluster
    user: scoped-executor
    namespace: aegissre-demo
current-context: aegis-scoped-executor
