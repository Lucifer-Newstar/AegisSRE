apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegissre-executor
  namespace: aegissre-demo
rules:
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [catalog-service, cart-service, order-service, payment-service]
  verbs: [get, patch]
- apiGroups: [apps]
  resources: [deployments/scale]
  resourceNames: [catalog-service, cart-service, order-service, payment-service]
  verbs: [get, update, patch]
- apiGroups: [apps]
  resources: [replicasets]
  verbs: [list]
