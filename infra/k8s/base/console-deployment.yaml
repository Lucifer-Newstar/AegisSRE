# console Kubernetes base (ADR-0005: 1:1 with the Compose service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: aegissre
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        app.kubernetes.io/part-of: aegissre
    spec:
      automountServiceAccountToken: false
      containers:
        - name: console
          image: aegissre/console:0.1.0
          ports:
            - containerPort: 3030
              name: http
          env:
            - name: AEGIS_CONSOLE_GATEWAY_URL
              value: http://api-gateway:8000
            - name: AEGIS_CONSOLE_ORIGIN
              value: http://localhost:3030
            - name: AEGIS_CONSOLE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: aegissre-console
                  key: session-secret
            - name: SERVICE_NAME
              value: console
            - name: SERVICE_PORT
              value: "3030"
            - name: ENVIRONMENT
              value: dev
            - name: REGISTRY_URL
              value: http://registry-service:8101
            - name: DEPLOYMENTS_URL
              value: http://deployments-service:8701
            - name: HOSTNAME
              value: 0.0.0.0
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
