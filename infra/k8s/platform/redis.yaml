apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: &id001
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: aegissre
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - name: tcp
          containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        args:
        - redis-server
        - --appendonly
        - 'yes'
        readinessProbe:
          tcpSocket: &id002
            port: 6379
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        startupProbe:
          tcpSocket: *id002
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
  serviceName: redis
