apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: &id001
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aegissre
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.0
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.enable-lifecycle
        - --web.enable-remote-write-receiver
        readinessProbe:
          httpGet: &id002
            path: /-/ready
            port: 9090
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        startupProbe:
          httpGet: *id002
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: prometheus-data
          mountPath: /prometheus
        - name: platform-prometheus
          mountPath: /etc/prometheus
          readOnly: true
      volumes:
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data
      - name: platform-prometheus
        configMap:
          name: platform-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
