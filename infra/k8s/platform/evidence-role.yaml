apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegissre-evidence
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - list
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - list
