apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shop-postgres
  labels: &id001
    app.kubernetes.io/name: shop-postgres
    app.kubernetes.io/part-of: aegisshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-postgres
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: shop-postgres
        image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
        ports:
        - name: tcp
          containerPort: 5432
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: aegisshop-postgres
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aegisshop-postgres
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: aegisshop-postgres
              key: database
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          tcpSocket: &id002
            port: 5432
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        startupProbe:
          tcpSocket: *id002
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        volumeMounts:
        - name: shop-postgres-data
          mountPath: /var/lib/postgresql/data
        - name: shop-postgres-socket
          mountPath: /var/run/postgresql
      volumes:
      - name: shop-postgres-data
        persistentVolumeClaim:
          claimName: shop-postgres-data
      - name: shop-postgres-socket
        emptyDir:
          sizeLimit: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
  serviceName: shop-postgres
