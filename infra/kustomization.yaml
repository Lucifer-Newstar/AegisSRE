apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegissre-demo
resources:
- k8s/base
- k8s/platform
configMapGenerator:
- name: platform-prometheus
  files:
  - prometheus/prometheus.yml
  - prometheus/alerts.yml
- name: platform-otel
  files:
  - config.yaml=otel/otel-collector.yaml
- name: platform-loki
  files:
  - loki/loki-config.yaml
- name: platform-tempo
  files:
  - tempo/tempo.yaml
- name: platform-grafana-datasources
  files:
  - grafana/provisioning/datasources/datasources.yml
- name: platform-grafana-provisioning
  files:
  - grafana/provisioning/dashboards/dashboards.yml
- name: platform-grafana-dashboards
  files:
  - grafana/dashboards/aegisshop-catalog.json
  - grafana/dashboards/aegisshop-logs.json
  - grafana/dashboards/aegisshop-overview.json
