[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegissre-telemetry"
version = "0.2.0"
description = "AegisSRE telemetry envelope contract (v0.2, incl. Deployment Intelligence fields)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
observability = [
    "fastapi>=0.115",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["telemetry*"]
