[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegissre-security"
version = "0.1.0"
description = "Small fail-closed ASGI service boundary for AegisSRE metadata"
requires-python = ">=3.12"
dependencies = ["starlette>=0.40"]

[project.optional-dependencies]
dev = ["fastapi>=0.115", "httpx>=0.27", "pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["aegis_security*"]
