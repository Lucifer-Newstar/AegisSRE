[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegissre-incidents-service"
version = "0.1.0"
description = "Local evidence-led reliability loop for AegisSRE"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.3", "scikit-learn>=1.5,<2", "httpx>=0.27", "prometheus-client>=0.20", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2", "redis>=5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["incidents_service*"]
