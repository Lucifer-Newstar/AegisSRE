[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegissre-api-gateway"
version = "0.1.0"
description = "Authenticated fixed-route entrypoint for the AegisSRE control plane"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.3", "httpx>=0.27", "redis>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "fakeredis>=2.23"]

[tool.setuptools.packages.find]
include = ["api_gateway*"]
