# AegisSRE — CI: what runs on every push/PR to main
#
# Independent validation jobs. All must pass before merge.
#
#   config-yaml-compose  → YAML files parse + docker-compose.yml is valid
#   k8s-manifests        → K8s manifests match real schemas + kustomize bases assemble
#   docs-links           → every link inside docs/** points to a real file
#   python-quality       → ruff (style) + mypy (types) + pytest (tests) + contract drift
#   docker-build         → catalog + registry container images actually build
#   frontend-build       → console (Next.js) production build
#
# Hosted gates exercise actual storage, transport and running services.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1 ── YAML files parse + compose config is valid ───────────────────────────
  config-yaml-compose:
    name: Config (YAML + compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validator
        run: pip install pyyaml

      - name: All *.yml/*.yaml parse cleanly
        run: python3 scripts/validate_yaml.py

      - name: docker-compose.yml is valid
        run: docker compose config --quiet

  # 2 ── K8s manifests are real (ADR-0005: compose ⇄ K8s parity) ─────────────
  k8s-manifests:
    name: K8s manifests (kubeconform + kustomize)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform (schema validator)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin kustomize

      - name: Validate manifests against k8s schemas
        run: |
          # kustomization.yaml is not a k8s schema — it is validated by `kustomize build` below
          find infra/k8s infra/kind -name '*.yaml' ! -name 'kustomization.yaml' -print0 \
            | xargs -0 -r kubeconform -strict -summary

      - name: Kustomize bases assemble
        run: kustomize build infra/k8s/base > /dev/null

  # 3 ── Docs: every markdown link resolves ──────────────────────────────────
  docs-links:
    name: Docs (links resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: All docs/** links point at existing files
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path
          bad = []
          for p in sorted(Path("docs").rglob("*.md")):
              for m in re.finditer(r"\]\(([^)]+)\)", p.read_text()):
                  t = m.group(1).split("#")[0].strip()
                  if not t or t.startswith(("http", "mailto")):
                      continue
                  if not (p.parent / t).resolve().exists():
                      bad.append(f"{p}: {t}")
          if bad:
              raise SystemExit("Broken docs links:\n" + "\n".join(bad))
          print("All docs links: OK")
          EOF

  # 4 ── Backend: style, types, tests, and contract drift ────────────────────
  python-quality:
    name: Backend (ruff · mypy · pytest · contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages (editable, with dev extras)
        run: |
          pip install -r requirements-dev.txt

      - name: Style (ruff)
        run: ruff check backend demoapp scripts/ci

      - name: Types (mypy --strict)
        run: >
          mypy backend/libs/security scripts/ci backend/services/api-gateway backend/libs/telemetry backend/libs/eventbus backend/libs/storage
          backend/services/_template
          backend/services/registry-service
          backend/services/deployments-service
          backend/services/incidents-service
          demoapp/aegisshop/catalog-service
          demoapp/aegisshop/cart-service
          demoapp/aegisshop/order-service
          demoapp/aegisshop/payment-service

      - name: Tests (pytest)
        run: >
          pytest backend/libs/security backend/services/api-gateway backend/libs/telemetry backend/libs/eventbus backend/libs/storage
          backend/services/_template
          backend/services/registry-service
          backend/services/deployments-service
          backend/services/incidents-service
          demoapp/aegisshop/catalog-service
          demoapp/aegisshop/cart-service
          demoapp/aegisshop/order-service
          demoapp/aegisshop/payment-service

      - name: Contract drift (docs/contracts vs live APIs)
        run: python3 scripts/check_contract_drift.py

  # 5 ── Containers: images actually build ───────────────────────────────────
  docker-build:
    name: Container (catalog-service image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the catalog-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./demoapp/aegisshop/catalog-service/Dockerfile
          tags: aegisshop/catalog-service:ci-${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the registry-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/services/registry-service/Dockerfile
          tags: aegissre/registry-service:ci-${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the deployments-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/services/deployments-service/Dockerfile
          tags: aegissre/deployments-service:ci-${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 6 ── Frontend: P2 console scaffold ───────────────────────────────────────
  frontend-build:
    name: Frontend (console)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build console
        run: |
          cd frontend && npm ci && npm run build

  reliability-storage:
    name: Reliability storage (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: aegis_test
          POSTGRES_DB: aegis_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AEGIS_TEST_REDIS_URL: redis://127.0.0.1:16379/15
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://aegis_test:aegis_test@127.0.0.1:15432/aegis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked reliability dependencies
        run: |
          pip install -r backend/services/incidents-service/requirements.lock
          pip install --no-deps -e backend/services/incidents-service -e backend/libs/storage -e backend/libs/telemetry -e backend/libs/eventbus
      - name: Exercise real PostgreSQL and Redis delivery guarantees
        run: pytest backend/services/incidents-service/tests/test_intelligence_postgres.py backend/services/incidents-service/tests/test_knowledge_postgres.py backend/services/incidents-service/tests/test_postgres.py backend/libs/storage/tests/test_postgres_storage.py backend/libs/eventbus/tests/test_redis_integration.py

  metadata-compose:
    env:
      AEGIS_METADATA_API_TOKEN: ci-disposable-metadata-operator
      AEGIS_METADATA_READ_TOKEN: ci-disposable-metadata-reader
    name: Metadata APIs (Compose restart persistence)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start actual metadata services and dependencies
        run: docker compose up -d --build --wait --wait-timeout 180 postgres registry-service deployments-service
      - name: Seed through the public APIs
        run: python3 scripts/check_metadata_stack.py --seed
      - name: Restart application processes without deleting the database
        run: docker compose restart registry-service deployments-service
      - name: Verify persisted catalogue, deletion and deployment data
        run: python3 scripts/check_metadata_stack.py --verify
      - name: Collect stack diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200 > metadata-stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-stack-diagnostics
          path: metadata-stack.log
      - name: Clean up the isolated CI stack
        if: always()
        run: docker compose down -v

  runtime-compose:
    name: Reliability runtime (live collection + restart recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Disposable local CI fixture, never a deployment credential.
      AEGIS_API_TOKEN: ci-disposable-runtime-token
      AEGIS_METADATA_API_TOKEN: ci-disposable-metadata-operator
      AEGIS_METADATA_READ_TOKEN: ci-disposable-metadata-reader
      AEGIS_POLL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the integration driver's Redis client
        run: pip install -c backend/services/incidents-service/requirements.lock redis
      - name: Build and start actual runtime and instrumented workload
        run: docker compose up -d --build --wait --wait-timeout 240 api-gateway catalog-service
      - name: Prove live collection, durable processing and explicit quarantine
        run: python3 scripts/check_runtime_stack.py seed
      - name: Restart the application while a crashed consumer owns pending work
        run: docker compose restart incidents-service
      - name: Verify business persistence and pending-entry recovery
        run: python3 scripts/check_runtime_stack.py verify
      - name: Prove gateway authorization, routing, correlation and approval identity
        run: python3 scripts/check_gateway_stack.py
      - name: Prove real OTLP logs and traces join after durable collection
        run: python3 scripts/check_observability_stack.py
      - name: Prove actual pgvector retrieval and packaged runbook citations
        run: python3 scripts/check_knowledge_stack.py
      - name: Prove read-only Ask and citations against actually collected metrics
        run: python3 scripts/check_intelligence_stack.py
      - name: Collect runtime diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 300 > runtime-stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-stack-diagnostics
          path: runtime-stack.log
      - name: Clean up the isolated CI runtime
        if: always()
        run: docker compose down -v

  kubernetes-evidence:
    name: Kubernetes evidence (isolated kind + real RBAC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checksum-verified pinned kind and kubectl
        run: python3 scripts/ci/kind_evidence_gate.py install
      - name: Build the actual packaged incidents image for the isolated fixture
        run: docker build -f backend/services/incidents-service/Dockerfile -t aegissre/evidence:ci .
      - name: Create a new runner-local cluster with its own kubeconfig
        run: python3 scripts/ci/kind_evidence_gate.py create
      - name: Verify real warning capture, ownership, TLS, RBAC and SQL staging
        run: python3 scripts/ci/kind_evidence_gate.py verify
      - name: Collect only disposable fixture diagnostics
        if: always()
        run: python3 scripts/ci/kind_evidence_gate.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kind-evidence-diagnostics
          path: ${{ runner.temp }}/aegis-kind-evidence/diagnostics
      - name: Delete only the cluster created by this fixture
        if: always()
        run: python3 scripts/ci/kind_evidence_gate.py cleanup
