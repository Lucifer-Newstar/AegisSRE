openapi: 3.1.0
info:
  title: AegisSRE Reliability API
  version: 0.1.0
paths:
  /intelligence/status:
    get:
      summary: Intelligence Status
      operationId: intelligence_status_intelligence_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Intelligence Status Intelligence Status Get
      security:
      - HTTPBearer: []
  /intelligence/tools:
    get:
      summary: Intelligence Tools
      operationId: intelligence_tools_intelligence_tools_get
      security:
      - HTTPBearer: []
      parameters:
      - name: service
        in: query
        required: true
        schema:
          type: string
          title: Service
      - name: question
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2000
          default: service health
          title: Question
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Intelligence Tools Intelligence Tools Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ask:
    post:
      summary: Ask
      operationId: ask_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /incidents/{incident_id}/investigate:
    post:
      summary: Investigate
      operationId: investigate_incidents__incident_id__investigate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Investigate Incidents  Incident Id  Investigate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /incidents/{incident_id}/investigation:
    get:
      summary: Investigation
      operationId: investigation_incidents__incident_id__investigation_get
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Investigation Incidents  Incident Id  Investigation
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ready:
    get:
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Ready Get
        '503':
          description: A dependency, worker or configured evidence source is unavailable
      security:
      - HTTPBearer: []
  /runtime:
    get:
      summary: Runtime Status
      operationId: runtime_status_runtime_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Runtime Status Runtime Get
      security:
      - HTTPBearer: []
  /metrics:
    get:
      summary: Scrape
      operationId: scrape_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /knowledge/status:
    get:
      summary: Knowledge Status
      operationId: knowledge_status_knowledge_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Knowledge Status Knowledge Status Get
      security:
      - HTTPBearer: []
  /knowledge/search:
    post:
      summary: Knowledge Search
      operationId: knowledge_search_knowledge_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Knowledge Search Knowledge Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /runbooks:
    get:
      summary: Runbooks
      operationId: runbooks_runbooks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Runbooks Runbooks Get
      security:
      - HTTPBearer: []
  /runbooks/{runbook_id}:
    get:
      summary: Runbook
      operationId: runbook_runbooks__runbook_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: runbook_id
        in: path
        required: true
        schema:
          type: string
          title: Runbook Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Runbook Runbooks  Runbook Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /incidents/{incident_id}/context:
    get:
      summary: Incident Context
      operationId: incident_context_incidents__incident_id__context_get
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Incident Context Incidents  Incident Id  Context Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events:
    post:
      summary: Ingest
      operationId: ingest_events_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ingest Events Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Evidence
      operationId: evidence_events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: service
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service
      - name: environment
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Evidence Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events/{event_id}:
    get:
      summary: Get Evidence
      operationId: get_evidence_events__event_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Evidence Events  Event Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /incidents:
    get:
      summary: List Incidents
      operationId: list_incidents_incidents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: service
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Incidents Incidents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /incidents/{incident_id}:
    get:
      summary: Incident
      operationId: incident_incidents__incident_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Incident Incidents  Incident Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /incidents/{incident_id}/{decision}:
    post:
      summary: Decide
      operationId: decide_incidents__incident_id___decision__post
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      - name: decision
        in: path
        required: true
        schema:
          enum:
          - approve
          - reject
          - defer
          type: string
          title: Decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Decide Incidents  Incident Id   Decision  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /actions/{incident_id}/execute:
    post:
      summary: Execute
      operationId: execute_actions__incident_id__execute_post
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Execute Actions  Incident Id  Execute Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /postmortems/{incident_id}:
    get:
      summary: Postmortem
      operationId: postmortem_postmortems__incident_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Postmortem Postmortems  Incident Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /postmortems:
    get:
      summary: Postmortems
      operationId: postmortems_postmortems_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Postmortems Postmortems Get
      security:
      - HTTPBearer: []
  /audit:
    get:
      summary: Audits
      operationId: audits_audit_get
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Incident Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Audits Audit Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /autonomy:
    get:
      summary: Get Mode
      operationId: get_mode_autonomy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Mode Autonomy Get
      security:
      - HTTPBearer: []
    post:
      summary: Set Mode
      operationId: set_mode_autonomy_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Set Mode Autonomy Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    AskRequest:
      properties:
        service:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          title: Service
        question:
          type: string
          maxLength: 2000
          minLength: 1
          title: Question
      additionalProperties: false
      type: object
      required:
      - service
      - question
      title: AskRequest
    AskResult:
      properties:
        id:
          type: string
          title: Id
        engine:
          type: string
          enum:
          - evidence-only-v1
          - structured-llm-v1
          title: Engine
        inference_status:
          type: string
          enum:
          - disabled
          - complete
          - failed
          title: Inference Status
        diagnostic:
          anyOf:
          - type: string
          - type: 'null'
          title: Diagnostic
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        answer:
          $ref: '#/components/schemas/CitedAnswer'
        snapshot:
          $ref: '#/components/schemas/EvidenceSnapshot'
        caveat:
          type: string
          title: Caveat
          default: Model output is an unverified interpretation, not proof of cause,
            current health, or authority to act.
      additionalProperties: false
      type: object
      required:
      - id
      - engine
      - inference_status
      - answer
      - snapshot
      title: AskResult
    CitedAnswer:
      properties:
        summary:
          type: string
          maxLength: 1500
          minLength: 1
          title: Summary
        evidence_ids:
          items:
            type: string
          type: array
          maxItems: 15
          title: Evidence Ids
        hypotheses:
          items:
            $ref: '#/components/schemas/Hypothesis'
          type: array
          maxItems: 5
          title: Hypotheses
        limitations:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Limitations
      additionalProperties: false
      type: object
      required:
      - summary
      - evidence_ids
      - hypotheses
      - limitations
      title: CitedAnswer
    Decision:
      properties:
        actor:
          type: string
          maxLength: 100
          minLength: 1
          title: Actor
        note:
          type: string
          maxLength: 1000
          title: Note
          default: ''
      additionalProperties: false
      type: object
      required:
      - actor
      title: Decision
    Event:
      properties:
        id:
          type: string
          maxLength: 160
          minLength: 1
          title: Id
        schema_version:
          type: string
          const: '0.2'
          title: Schema Version
          default: '0.2'
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        source:
          type: string
          enum:
          - prometheus
          - loki
          - tempo
          - k8s
          - deployment
          - chaoslab
          - ml
          - ai
          - policy
          - executor
          - registry
          title: Source
        type:
          type: string
          enum:
          - metric
          - log
          - deployment
          - trace
          - k8s_event
          - health
          - anomaly
          title: Type
        service:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          title: Service
        environment:
          type: string
          maxLength: 40
          minLength: 1
          title: Environment
          default: dev
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
          title: Severity
          default: info
        correlation_id:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Correlation Id
        trace_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Trace Id
        deployment:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Deployment
        payload:
          additionalProperties: true
          type: object
          title: Payload
      additionalProperties: false
      type: object
      required:
      - id
      - source
      - type
      - service
      - payload
      title: Event
    EvidenceItem:
      properties:
        id:
          type: string
          title: Id
        source_ref:
          type: string
          title: Source Ref
        kind:
          type: string
          title: Kind
        observed_at:
          type: string
          title: Observed At
        stale:
          type: boolean
          title: Stale
        content:
          additionalProperties: true
          type: object
          title: Content
      additionalProperties: false
      type: object
      required:
      - id
      - source_ref
      - kind
      - observed_at
      - stale
      - content
      title: EvidenceItem
    EvidenceSnapshot:
      properties:
        service:
          type: string
          title: Service
        environment:
          type: string
          title: Environment
        captured_at:
          type: string
          title: Captured At
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceItem'
          type: array
          title: Evidence
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCall'
          type: array
          title: Tool Calls
        read_only:
          type: boolean
          const: true
          title: Read Only
          default: true
        authorizes_actions:
          type: boolean
          const: false
          title: Authorizes Actions
          default: false
        redaction:
          type: string
          title: Redaction
          default: Selected bounded fields with best-effort secret redaction, not
            a guarantee of complete removal.
      additionalProperties: false
      type: object
      required:
      - service
      - environment
      - captured_at
      - evidence
      - tool_calls
      title: EvidenceSnapshot
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Hypothesis:
      properties:
        cause:
          type: string
          enum:
          - database_outage
          - memory_exhaustion
          - container_crash
          - config_error
          - dependency_failure
          - network_latency
          - http_5xx
          - faulty_deployment
          - cpu_saturation
          - traffic_spike
          - unknown
          title: Cause
        confidence:
          type: string
          enum:
          - low
          - medium
          title: Confidence
        explanation:
          type: string
          maxLength: 700
          minLength: 1
          title: Explanation
        evidence_ids:
          items:
            type: string
          type: array
          maxItems: 12
          minItems: 1
          title: Evidence Ids
      additionalProperties: false
      type: object
      required:
      - cause
      - confidence
      - explanation
      - evidence_ids
      title: Hypothesis
    KnowledgeSearch:
      properties:
        query:
          type: string
          maxLength: 2000
          minLength: 1
          title: Query
        service:
          type: string
          maxLength: 63
          minLength: 1
          title: Service
        limit:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Limit
          default: 5
        kind:
          anyOf:
          - type: string
            enum:
            - runbook
            - incident
            - service
            - failure_pattern
          - type: 'null'
          title: Kind
      additionalProperties: false
      type: object
      required:
      - query
      - service
      title: KnowledgeSearch
    ModeIn:
      properties:
        actor:
          type: string
          maxLength: 100
          minLength: 1
          title: Actor
        note:
          type: string
          maxLength: 1000
          title: Note
          default: ''
        mode:
          type: string
          enum:
          - observe
          - recommend
          - auto-safe
          title: Mode
      additionalProperties: false
      type: object
      required:
      - actor
      - mode
      title: ModeIn
    ToolCall:
      properties:
        name:
          type: string
          enum:
          - get_metrics
          - get_logs
          - get_traces
          - get_health
          - get_deployments
          - get_k8s_events
          - search_runbooks
          title: Name
        status:
          type: string
          enum:
          - available
          - missing
          - stale
          - unavailable
          title: Status
        checked_at:
          type: string
          title: Checked At
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        detail:
          type: string
          title: Detail
      additionalProperties: false
      type: object
      required:
      - name
      - status
      - checked_at
      - evidence_ids
      - detail
      title: ToolCall
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
